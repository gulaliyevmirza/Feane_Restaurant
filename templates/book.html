{% extends 'base/base.html' %}
{% load static %}

{% block content %}

  <!-- book section -->
  <section class="book_section layout_padding">
    <div class="container">
      <div class="heading_container">
        <h2>
          Book A Table
        </h2>
      </div>
      <div class="row">
        <div class="col-md-6">
          <div class="form_container">
            <form method="post" action="{% url 'book' %}">
              {% csrf_token %}
              {% if request.GET.success == '1' %}
                <div class="alert alert-success" role="alert">
                  Rezervasiyanız qəbul edildi. Tezliklə sizinlə əlaqə saxlanılacaq.
                </div>
              {% endif %}
              <div>
                <input type="text" name="name" class="form-control" placeholder="Your Name" required />
              </div>
              <div>
                <input type="text" name="phone" class="form-control" placeholder="Phone Number" required />
              </div>
              <div>
                <input type="email" name="email" class="form-control" placeholder="Your Email" />
              </div>
              <div>
                <select name="persons" class="form-control nice-select wide" required>
                  <option value="" disabled selected>How many persons?</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                </select>
              </div>
              <div>
                <input type="date" name="date" class="form-control" required>
              </div>
              <div>
                <input type="time" name="time" class="form-control" required>
              </div>
              <div>
                <textarea name="message" class="form-control" placeholder="Message (optional)"></textarea>
              </div>
              <div class="btn_box">
                <button type="submit" class="btn btn-primary">Book Now</button>
              </div>
            </form>
          </div>
        </div>
        <div class="col-md-6">
          <div class="map_container ">
            <div id="googleMap"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- end book section -->

{% endblock %}
